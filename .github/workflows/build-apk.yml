name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail

          printf '%s' "$GOOGLE_SERVICES_JSON_B64" |
            tr -d '[:space:]' |
            base64 --decode > app/google-services.json

          test -s app/google-services.json

      - name: Verify Firebase config
        run: |
          test -f app/google-services.json
          python3 -m json.tool app/google-services.json > /dev/null
          echo "Firebase config JSON is valid"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show APK
        run: find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Raj-Coaching-APK
          path: app/build/outputs/apk/debug/app-debug.apk

